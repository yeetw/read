<section class="category-heatmap" aria-labelledby="category-heatmap-title">
  <div id="category-summary" class="category-summary-cards" aria-live="polite">
    <div class="category-summary-card"><strong id="category-total-value">—</strong><span>已讀本數</span></div>
    <div class="category-summary-card"><strong id="category-period-value">—</strong><span>統計期間</span><small id="category-period-detail"></small></div>
    <div class="category-summary-card"><strong id="category-largest-value">—</strong><span>最大類別占比</span><small id="category-largest-detail"></small></div>
  </div>
  <div class="category-heatmap__heading"><h2 id="category-heatmap-title">讀了哪些主題</h2><p>臺灣使用的中文圖書分類法（2007 年版）・依閱讀本數排序</p></div>
  <div class="category-controls" role="group" aria-label="分類層級"><button type="button" data-level="major" aria-pressed="true">十大類</button><button type="button" data-level="division" aria-pressed="false">細分類</button><button type="button" data-level="section" aria-pressed="false">個位分類</button></div>
  <div class="category-heatmap__scroll" tabindex="0" role="region" aria-label="圖書分類排行，向下捲動看更多"><table><caption>各分類本數與占全部已讀紀錄的比例</caption><thead><tr><th scope="col">圖書分類</th><th scope="col">總量</th><th scope="col">比例</th></tr></thead><tbody id="category-heatmap-body"></tbody><tfoot id="category-heatmap-total"></tfoot></table></div>
  <h2 id="category-year-title">每年度閱讀主題占比・2021 – 2026</h2>
  <div id="category-legend" class="category-legend"></div><div id="category-year-chart" role="region" aria-labelledby="category-year-title"></div>
  <noscript>請啟用 JavaScript 以顯示分類統計。</noscript>
</section>
<script id="category-heatmap-data" type="application/json">
{
  "sections": {{ site.data.category_sections | jsonify }},
  "majors": {{ site.data.categories.major_classes | jsonify }},
  "labels": {{ site.data.categories.divisions | jsonify }},
  "years": {
  {% assign category_years = "2021,2022,2023,2024,2025,2026" | split: "," %}
  {% for year in category_years %}
    {% assign category_books = site.data[year] | where_exp: "book", "book.pending != true" | where_exp: "book", "book.finished != false" %}
    "{{ year }}": [{% for book in category_books %}{{ book.category | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]{% unless forloop.last %},{% endunless %}
  {% endfor %}
  }
}
</script>
<script src="{{ "/assets/category-stats.js" | relative_url }}" defer></script>
